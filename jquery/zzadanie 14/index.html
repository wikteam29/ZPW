<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    </style>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            $("#kolor").change(function(){
                $("body").css("background-color", $(this).val());
            })
            $("#rozmiarPizzy").change(function(){
                $("#rozmiar").text($(this).val() + " zł");
            })

            $("#newsletter").change(function(){
                if($(this).is(":checked") /*lub this.checked*/) $("#stan").text("Zapisano do newslettera");
                else $("#stan").text("Wypisano z newslettera");
            })

            $("#butt").change(function(){
                if($(this).is(":checked")){
                    $("#button").prop("disabled", false);
                    //lub $("#button").removeAttr("disabled");
                }else{
                    $("#button").prop("disabled", true);
                    //lub $("#button").attr("disabled", "disabled");
                }

                //lub 

                $("#button").prop("disabled", !$(this).is(":checked"));
            })

            $("#tekst").on("input", function(){
                $("#podglad").text($(this).val());
            })

            $("#komentarz").on("input", function(){
                let zostalo = $(this).prop("maxlength") - $(this).val().length;

                if(zostalo <= 10) $("#licznik").css("color", "red")
                else $("#licznik").css("color", "black"); 

                $("#licznik").text(`Pozostało ${zostalo} znaków`);
            })
        });
    </script>
</head>
<body>
    <select id="kolor">
        <option value="white">Biały</option>
        <option value="yellow">Żółty</option>
        <option value="lightblue">Niebieski</option>
    </select>
    <hr>
    <select id="rozmiarPizzy">
        <option value="20">mała</option>
        <option value="30">średnia</option>
        <option value="40">duża</option>
    </select>
    <p id="rozmiar"></p>
    <hr>
    <input type="checkbox" id="newsletter">Chcę newsletter
    <p id="stan"></p>
    <hr>
    <input type="checkbox" id="butt">Akceptuje regulamin
    <button id="button" disabled>Zarejestruj</button>
    <hr>

    <input type="text" id="tekst">
    <p>Podgląd: <span id="podglad"></span></p>
    <hr>

    <textarea maxlength="100" id="komentarz"></textarea>
    <p id="licznik">Pozostało 100 znaków</p>
</body>
</html>
