<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ch{
            width: 20px;
            height: 20px;
            background-color: red;
            position: absolute;
        }
        .ch2{
            width: 20px;
            height: 20px;
            background-color: green;
            position: absolute;
        }
        #arena{
            margin-left: 100px;
            width: 1250px;
            height: 500px;
            border: solid black 3px;
        }
    </style>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            //Object Event
            let kwX = 0;
            let kwY = 0;
            let jpX = 0;
            let jpY = 0;

            let $kw = $("#kwadrat");
            let $jp = $("#japko");

            let kwWidth = parseInt($kw.css("width"));
            let kwHeight = parseInt($kw.css("height"));

            let jpWidth = parseInt($jp.css("width"));
            let jpHeight = parseInt($jp.css("height"));

            function randomJapkoTeleport(){
                jpX = Math.floor((Math.random() * 1230) + 20 - jpWidth);
                jpY = Math.floor((Math.random() * 480) + 20 - jpHeight);

                $jp.css({
                    "margin-left": jpX,
                    "margin-top": jpY
                })
            }

            function checkColision(kwX, kwY, jpX, jpY, kwWidth, kwHeight, jpWidth, jpHeight){
                if(
                    kwX < jpX + jpWidth &&
                    kwX + kwWidth > jpX &&
                    kwY < jpY + jpHeight &&
                    kwY + kwHeight > jpY 
                ){
                    return true;
                }else{
                    return false;
                }
            }

            $(document).on("keydown keyup keypress", function(){
                $("#eventType").text(event.type);
            })

            $(document).on("mousemove", function(){
                $("#pageX").text(event.pageX);
                $("#pageY").text(event.pageY);
            })

            let speed = 10;

            randomJapkoTeleport();

            $(document).on("keypress", function(){
                switch(event.key){
                    case "a":
                        if(kwX - speed < 0){
                            kwX = 0;
                            $kw.css("margin-left",kwX)
                        }else{
                            kwX -= speed;
                            $kw.css("margin-left",kwX);
                        }
                        break;
                    case "d":
                        if(kwX + speed > 1250 - kwWidth){
                            kwX = 1250 - kwWidth;
                            $kw.css("margin-left",kwX)
                        }else{
                            kwX += speed;
                            $kw.css("margin-left",kwX);
                        }
                        break;
                    case "w":
                        if(kwY - speed < 0){
                            kwY = 0;
                            $kw.css("margin-top",kwY)
                        }else{
                            kwY -= speed;
                            $kw.css("margin-top",kwY);
                        }
                        break;
                    case "s":
                        if(kwY + speed > 500 - kwHeight){
                            kwY = 500 - kwHeight;
                            $kw.css("margin-top",kwY)
                        }else{
                            kwY += speed;
                            $kw.css("margin-top",kwY);
                        }
                        break;
                }

                if(checkColision(kwX, kwY, jpX, jpY, kwWidth, kwHeight, jpWidth, jpHeight)){
  
                    if(speed + kwWidth > 1250){
                        speed = 1250 - kwWidth;
                    }else if(speed < 50){
                        speed += 5; 
                    }
                    if(kwHeight < 500){
                        kwHeight += 10;
                    }
                    if(kwWidth < 1250){
                        kwWidth += 10;
                    }

                    $kw.css({
                        "width": kwWidth,
                        "height": kwHeight
                    });
                    kwWidth = parseInt($kw.css("width"));
                    kwHeight = parseInt($kw.css("height"));

                    if(kwX + kwWidth > 1250){
                        kwX = 1250 - kwWidth;
                        $kw.css("margin-left",kwX)
                    }

                    if(kwY + kwHeight > 500){
                        kwY = 500 - kwHeight;
                        $kw.css("margin-top",kwY)
                    }


                    randomJapkoTeleport();
                    if(kwWidth > 1220){
                        kwWidth = 20;
                        kwHeight = 20;
                        speed = 10;
                        kwX = 0;
                        kwY = 0;
                        $kw.css({
                            "width": kwWidth,
                            "height": kwHeight,
                            "margin-left": kwX,
                            "margin-top": kwY
                        });
                        alert("WYGRAŁEŚ!!! \n ŚŻK!!!!");
                        return false;
                    }else{
                        console.log(kwWidth);
                        while(checkColision(kwX, kwY, jpX, jpY, kwWidth, kwHeight, jpWidth, jpHeight)){
                            randomJapkoTeleport();
                        }
                    }
                }
            })

            
        });
    </script>
</head>
<body>
    <input type="text" id="pole">

    <p>
        Typ zdarzenia:
        <span id="eventType">---</span>
    </p>

    <p>
        Pozycja myszy:
        x = <span id="pageX">---</span>
        y = <span id="pageY">---</span>
    </p>

    <div id="arena">
        <div class="ch" id="kwadrat"></div>

        <div class="ch2" id="japko"></div>
    </div>
</body>
</html>
