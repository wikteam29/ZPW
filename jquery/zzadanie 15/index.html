<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    </style>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            $("#sprawdz").click(function(){
                let imie = $("#imie").val().trim();
                if(imie === "") 
                    $("#blad").text("Pole imie jest wymagane");
                else 
                    $("#blad").text(`Twoje imię to: ${imie}`)
            })

            $("#formularz").submit(function(e){
                e.preventDefault();
                let nazwisko = $("#nazwisko").val().trim();

                if(nazwisko === "") 
                    $("#wynik").text("Pole nazwisko jest wymagane").css("color", "red");
                else 
                    $("#wynik").text("Wysłano formularz").css("color", "green");
            })

            $("#sprawdzWiek").click(function(){
                let wiek = Number($("#wiek").val());
                if(isNaN(wiek))
                    $("#bladWiek").text("Wiek musi być liczbą");
                else
                    $("#bladWiek").text(`Masz ${wiek} lat`);
            })

            $("#save").click(function(){
                let ocena = Number($("#ocena").val());
                if(isNaN(ocena))
                    $("#bladOcena").text("To nie jest liczba");
                else if(ocena < 1 || ocena > 6)
                    $("#bladOcena").text("Ocena musi być z zakresu 1-6");
                else if(!Number.isInteger(ocena))
                    $("#bladOcena").text("Ocena musi być liczbą całkowitą");
                else
                    $("#bladOcena").text(`Zapisano ocenę: ${ocena}`);
            })
        });
    </script>
</head>
<body>
    <input type="text" id="imie">
    <button id="sprawdz">Sprawdź</button>
    <p id="blad"></p>
    <hr>

    <form id="formularz">
        <label>Nazwisko</label>
        <input id="nazwisko">
        <button type="submit">Wyślij</button>
    </form>
    <p id="wynik"></p>
    <hr>
    <input type="text" id="wiek">
    <button id="sprawdzWiek">Sprawdź</button>
    <p id="bladWiek"></p>
    <hr>

    <input type="text" id="ocena">
    <button id="save">Zapisz</button>
    <p id="bladOcena"></p>
</body>
</html>
