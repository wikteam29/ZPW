<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    </style>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            let suma = 0;
            $("li").each(function() {
                suma += $(this).data("cena");
            });

            $("#suma").text(suma);

            $("li").each(function() {
            
                if($(this).data("cena") > 20) {
                    $(this).addClass("drogie");
                }
            });

            $("li").each( function(index, element) {
                if(index % 2 == 0) {
                    $(this).css("color", "grey");
                }
            });

            $("li").each(function() {
                if($(this).data("cena") > 20) {
                    $(this).css("backgroundColor", "lightGreen");
                    return false;
                }
            });
        });
    </script>
</head>
<body>
    <ul id="lista">
        <li data-cena="10">Chleb</li>
        <li data-cena="25">Ser</li>
        <li data-cena="5">Woda</li>
        <li data-cena="40">Szynka</li>
    </ul>
    <p id="suma"></p>
</body>
</html>
